# Elastic Beanstalk's Node.js platform puts nginx in front of the app, and
# nginx's default client_max_body_size is 1 MB. A .glb dish model is routinely
# 2-25 MB, so every 3D model upload was rejected by the proxy with
# "413 Request Entity Too Large" before Express or multer ever saw the request
# — which is why raising the application-side limits alone changed nothing.
#
# 50 MB matches the multer per-file limit in src/routes/media.routes.ts. Keep
# the two in step: nginx rejects anything larger with a bare HTML 413, whereas
# multer rejects it with the API's JSON error envelope, so multer should always
# be the one to say no.
client_max_body_size 50M;

# A large upload on a slow phone connection must not be cut off mid-body.
client_body_timeout 300s;
